name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 04:00 UTC to prevent Supabase 7-day inactivity pause
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  keepalive:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keepalive Table
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::GitHub Secrets SUPABASE_URL and SUPABASE_ANON_KEY must be set in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          CLEAN_URL="${{ secrets.SUPABASE_URL }}"
          CLEAN_URL="${CLEAN_URL%/}"

          echo "Pinging $CLEAN_URL/rest/v1/keepalive..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "$CLEAN_URL/rest/v1/keepalive?select=id,pinged_at&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Success: Supabase keepalive ping recorded successfully!"
          else
            echo "::error::Supabase ping failed with status $HTTP_CODE"
            exit 1
          fi
